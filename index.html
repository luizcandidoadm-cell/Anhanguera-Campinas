<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anhanguera Campinas Taquaral - Mapa Sala EAD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #eef2f5;
            color: #333;
            padding: 20px 10px;
        }

        .card-container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background-color: #f26522;
            color: #ffffff;
            text-align: center;
            padding: 24px 15px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .content-body {
            padding: 24px 28px;
        }

        .filters-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
        }

        .filter-group {
            flex: 1;
            min-width: 140px;
            display: flex;
            flex-direction: column;
        }

        .filter-group.group-search {
            flex: 2.2;
            min-width: 260px;
        }

        .filter-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
            color: #2d3748;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #f26522;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 20px;
        }

        .btn-clear {
            background: none;
            border: none;
            color: #f26522;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-clear:hover {
            text-decoration: underline;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #4a5568;
            border-bottom: 2px solid #edf2f7;
        }

        td {
            padding: 14px 14px;
            font-size: 0.9rem;
            color: #2d3748;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        td.curso-nome {
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .tag-dia {
            background-color: #fff9db;
            border: 1px solid #ffe066;
            color: #856404;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: inline-block;
            font-weight: 600;
        }

        .dot-turno {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .dot-manha { background-color: #f59f00; }
        .dot-noite { background-color: #3b5bdb; }

        .tag-sala {
            background-color: #fff4e6;
            border: 1px solid #ffd8a8;
            color: #d9480f;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.88rem;
            display: inline-block;
        }

        .mediador-nome {
            text-transform: uppercase;
            font-size: 0.88rem;
            color: #4a5568;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Cabeçalho Laranja -->
        <header class="header">
            <h1>Anhanguera Campinas Taquaral</h1>
            <p>Mapa Sala EAD</p>
        </header>

        <div class="content-body">
            <!-- Área dos Filtros -->
            <div class="filters-grid">
                <div class="filter-group group-search">
                    <label for="searchInput">Buscar (Curso, Sala ou Tutor):</label>
                    <input type="text" id="searchInput" placeholder="Ex: Enfermagem, Sala 84...">
                </div>

                <div class="filter-group">
                    <label for="filterDia">Dia da Semana:</label>
                    <select id="filterDia">
                        <option value="">Todos</option>
                        <option value="Segunda">Segunda</option>
                        <option value="Terça">Terça</option>
                        <option value="Quarta">Quarta</option>
                        <option value="Quinta">Quinta</option>
                        <option value="Sexta">Sexta</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterTurno">Turno:</label>
                    <select id="filterTurno">
                        <option value="">Todos</option>
                        <option value="Manhã">Manhã</option>
                        <option value="Noite">Noite</option>
                    </select>
                </div>
            </div>

            <!-- Contador e Limpar Filtros -->
            <div class="status-bar">
                <span id="counter">0 sala(s) encontrada(s)</span>
                <button type="button" id="btnClear" class="btn-clear">Limpar Filtros</button>
            </div>

            <!-- Tabela -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Curso</th>
                            <th>Dia</th>
                            <th>Turno</th>
                            <th>Série</th>
                            <th>Sala</th>
                            <th>Mediador</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>

                <div id="noResults" class="no-results hidden">
                    <p><strong>Nenhuma sala encontrada.</strong></p>
                    <p>Tente ajustar os filtros ou os termos de busca.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
