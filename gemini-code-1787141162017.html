<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Sala EAD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <header class="header">
            <h1>Sua Instituição</h1>
            <p>Mapa Sala EAD</p>
        </header>

        <!-- Filtros e Busca -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por curso, sala ou mediador...">
            </div>

            <div class="filter-box">
                <select id="filterDia">
                    <option value="">Todos os dias</option>
                    <option value="SEGUNDA-FEIRA">Segunda-feira</option>
                    <option value="TERÇA-FEIRA">Terça-feira</option>
                    <option value="QUARTA-FEIRA">Quarta-feira</option>
                    <option value="QUINTA-FEIRA">Quinta-feira</option>
                    <option value="SEXTA-FEIRA">Sexta-feira</option>
                </select>

                <select id="filterTurno">
                    <option value="">Todos os turnos</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Noite">Noite</option>
                </select>
            </div>
        </div>

        <!-- Tabela -->
        <div class="table-responsive">
            <table id="salasTable">
                <thead>
                    <tr>
                        <th>Curso</th>
                        <th>Dia</th>
                        <th>Turno</th>
                        <th>Série</th>
                        <th>Sala</th>
                        <th>Mediador</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>

            <!-- Mensagem caso nada seja encontrado -->
            <div id="noResults" class="no-results hidden">
                <p><strong>Nenhuma sala encontrada.</strong></p>
                <p>Tente ajustar os filtros ou os termos de busca.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
