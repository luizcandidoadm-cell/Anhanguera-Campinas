<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anhanguera Campinas Taquaral - Mapa Sala EAD</title>
    <!-- Ajustado para puxar exatamente o seu arquivo 'estilo.css' -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="card-container">
        <!-- Cabeçalho Laranja -->
        <header class="header">
            <h1>Anhanguera Campinas Taquaral</h1>
            <p>Mapa Sala EAD</p>
        </header>

        <div class="content-body">
            <!-- Área dos Filtros -->
            <div class="filters-grid">
                <div class="filter-group group-search">
                    <label for="searchInput">Buscar (Curso, Sala ou Tutor):</label>
                    <input type="text" id="searchInput" placeholder="Ex: Enfermagem, Sala 84...">
                </div>

                <div class="filter-group">
                    <label for="filterDia">Dia da Semana:</label>
                    <select id="filterDia">
                        <option value="">Todos</option>
                        <option value="Segunda">Segunda</option>
                        <option value="Terça">Terça</option>
                        <option value="Quarta">Quarta</option>
                        <option value="Quinta">Quinta</option>
                        <option value="Sexta">Sexta</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterTurno">Turno:</label>
                    <select id="filterTurno">
                        <option value="">Todos</option>
                        <option value="Manhã">Manhã</option>
                        <option value="Noite">Noite</option>
                    </select>
                </div>
            </div>

            <!-- Contador e Limpar Filtros -->
            <div class="status-bar">
                <span id="counter">0 sala(s) encontrada(s)</span>
                <button type="button" id="btnClear" class="btn-clear">Limpar Filtros</button>
            </div>

            <!-- Tabela -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Curso</th>
                            <th>Dia</th>
                            <th>Turno</th>
                            <th>Série</th>
                            <th>Sala</th>
                            <th>Mediador</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>

                <div id="noResults" class="no-results hidden">
                    <p><strong>Nenhuma sala encontrada.</strong></p>
                    <p>Tente ajustar os filtros ou os termos de busca.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
